[workspace]
resolver = "2"
members = [
    "crates/wolin-core",
    "crates/wolin-storage",
    "crates/wolin-identity",
    "crates/wolin-policy",
    "crates/wolin-mcp",
    "crates/wolin-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Entropy Paradox, Inc."]
license = "MIT OR Apache-2.0"
repository = "https://github.com/entropyparadox/wolin"

[workspace.dependencies]
# Internal workspace crates
wolin-core = { path = "crates/wolin-core" }
wolin-storage = { path = "crates/wolin-storage" }
wolin-identity = { path = "crates/wolin-identity" }
wolin-policy = { path = "crates/wolin-policy" }
wolin-mcp = { path = "crates/wolin-mcp" }

# Async & Web
tokio = { version = "1.41", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization & Utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
anyhow = "1.0"

# Semantic & Storage
oxigraph = "0.4"
opendal = { version = "0.51", features = ["services-fs", "services-memory"] }
